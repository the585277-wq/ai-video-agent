name: Daily AI Video Agent

on:
  workflow_dispatch:
    inputs:
      user_prompt:
        description: 'Enter your command (e.g., Create a video about Hulk transformation)'     
        required: false
        default: 'Create a trending YouTube Shorts video plan and script.'
  schedule:
    - cron: '0 12 * * *' # Protidin UTC dupur 12 tar (Bangladesh shondha 6 tar) somoy automatic run hobe

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_PROMPT: ${{ github.event.inputs.user_prompt }}
        run: python main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-content
          path: |
            daily_video_plan.txt
            daily_script.txt
