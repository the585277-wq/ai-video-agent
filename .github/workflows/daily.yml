name: Daily AI Video Agent

on:
  workflow_dispatch: # Eta manually run korar jonno
  schedule:
    - cron: '0 12 * * *' # Protidin UTC dupur 12 tar (Bangladesh shondha 6 tar) somoy automatic run hobe

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-content
          path: |
            daily_video_plan.txt
            daily_script.txt
