name: Daily AI Video Agent

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI Agent
        run: python main.py

      - name: Save Daily Video Plan
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-plan
          path: daily_video_plan.txt
