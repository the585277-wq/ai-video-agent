name: Daily AI Video Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # প্রতিদিন সকাল ৬টায় (UTC) স্বয়ংক্রিয়ভাবে রান হবে

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # আপনার রিপোজিটরিতে requirements.txt থাকলে নিচের লাইনটি আনকমেন্ট করুন
          # pip install -r requirements.txt

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-plan
          path: daily_video_plan.txt
