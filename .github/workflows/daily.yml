name: Daily AI Video Agent

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৬:০০ টায় চলবে (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run AI Agent
        run: python main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-content
          path: |
            *.txt
            *.json
            *.md
